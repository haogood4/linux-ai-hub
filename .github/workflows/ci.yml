name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm astro check

      - name: Completion audit
        run: pnpm check:completion

      - name: Internal link check
        run: pnpm check:links

      - name: Accessibility static audit
        run: pnpm check:a11y

      - name: Distro data audit
        run: pnpm check:distros

      - name: Release readiness
        run: pnpm release-prep --skip-git

      - name: Lighthouse CI gate
        run: CHROME_PATH=/usr/bin/google-chrome pnpm check:lhci

      - name: Verify build artifacts
        run: |
          test -f dist/search-index.json || { echo "search-index.json missing"; exit 1; }
          test -f dist/version.json || { echo "version.json missing"; exit 1; }
          test -f dist/sitemap-index.xml || { echo "sitemap missing"; exit 1; }
          test -f dist/llms.txt || { echo "llms.txt missing"; exit 1; }
          node -e "const i=JSON.parse(require('fs').readFileSync('dist/search-index.json')); if (i.total < 40) { console.error('search index too small:', i.total); process.exit(1); } console.log('search-index pages:', i.total)"
          node -e "
            const fs = require('fs');
            const txt = fs.readFileSync('dist/llms.txt', 'utf8');
            const urls = [...txt.matchAll(/\((https?:\/\/[^)]+)\)/g)].map((m) => m[1]).filter((u) => u.startsWith('https://tuxai.cn'));
            let bad = 0;
            for (const u of urls) {
              const p = new URL(u).pathname.replace(/\/$/, '');
              const file = 'dist' + p + (p.endsWith('.html') ? '' : '.html');
              if (!fs.existsSync(file) && !fs.existsSync('dist' + p)) { console.error('llms.txt dead link:', u); bad++; }
            }
            if (bad) process.exit(1);
            console.log('llms.txt links OK:', urls.length);"